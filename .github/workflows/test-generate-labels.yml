name: Test generate-labels

on:
  workflow_dispatch:
  push:
    paths:
      - "bin/generate-labels.sh"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download yq
        run: |
          wget https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 -O ${{ runner.temp }}/yq
          chmod +x ${{ runner.temp }}/yq

      - name: Create minimal test compose file
        run: |
          cat > ${{ runner.temp }}/docker-compose.yml << 'EOF'
          services:
            app:
              image: nginx
          EOF

      - name: Run generate-labels.sh
        env:
          APP_SERVERS: "www.example.com stage.example.com"
          LABELS_TARGET: app
          PROXY_PASS_PORT: "8080"
          DOCKER_COMPOSE_FILE: ${{ runner.temp }}/docker-compose.yml
          YQ: ${{ runner.temp }}/yq
        run: bash bin/generate-labels.sh

      - name: Print result
        run: |
          echo "=== merged docker-compose.yml ==="
          cat ${{ runner.temp }}/docker-compose.yml

      - name: Validate labels were injected
        run: |
          actual=$(${{ runner.temp }}/yq '.services.app.labels["imatic.server.serv1.server_name"]' ${{ runner.temp }}/docker-compose.yml)
          expected="www.example.com"
          if [[ "$actual" != "$expected" ]]; then
            echo "FAIL: expected '$expected', got '$actual'"
            exit 1
          fi
          actual=$(${{ runner.temp }}/yq '.services.app.labels["imatic.server.serv2.server_name"]' ${{ runner.temp }}/docker-compose.yml)
          expected="stage.example.com"
          if [[ "$actual" != "$expected" ]]; then
            echo "FAIL: expected '$expected', got '$actual'"
            exit 1
          fi
          echo "OK: all labels present and correct"
