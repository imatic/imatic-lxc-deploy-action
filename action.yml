name: "Imatic LXC Deploy"
description: "Deploys a docker compose file to LXC container."
inputs:
  server:
    description: "Hostname of the LXC server."
    required: true
  server_deploy_key:
    description: "Base64 encoded SSH private key to be used for deployment."
    required: true
  server_jumphost:
    description: "Hostname of the jumphost."
    required: true
    default: "imaticit-jumphost-prod@prod.imaticit-jumphost.dev.imatic.cz"
  server_deploy_dir:
    description: "Directory on the server where the project will be deployed."
    required: true
  project_domain_name:
    description: "Domain name of the project."
    required: true
  docker_compose_file:
    description: "The path to docker-compose file."
    required: true
    default: "./docker-compose.yml"
  version:
    description: "Image tag to be deployed."
    required: true
  registry:
    description: "The name of the docker registry to pull from."
    required: true
    default: "ghcr.io"
  external_network:
    description: "Ensures that this docker external network is created for the project when deploying to the server."
    required: false
  copy_files:
    description: |-
      List of files to copy from repository to server. GitHub doesn't support array yet, so it is specified as a string.

      ```yaml
      copy_files: >-
        file-in-repository1:destination-file1
        file-in-repository2:destination-file2
      ```
    required: false
runs:
  using: "composite"
  steps:
    - name: Set project env variables
      shell: bash
      run: |
        echo "# This file is generated by Imatic LXC Deploy action and should not be edited manually." > ${{ runner.temp }}/.env.deploy
        echo "PROJECT_IMAGE=${{ inputs.registry }}/${{ github.repository }}" >> ${{ runner.temp }}/.env.deploy
        PROJECT_VERSION=${{ inputs.version }} echo "PROJECT_VERSION=${PROJECT_VERSION:-$(git rev-parse --short HEAD)}" >> ${{ runner.temp }}/.env.deploy
        echo PROJECT_SERVER_NAME=${{ inputs.project_domain_name }} >> ${{ runner.temp }}/.env.deploy
        if [[ -n "${{ inputs.external_network }}" ]]; then echo PROJECT_EXTERNAL_NETWORK=${{ inputs.external_network }} >> ${{ runner.temp }}/.env.deploy; fi
    - name: Evaluate docker compose file
      shell: bash
      run: |
        docker compose -f ${{ inputs.docker_compose_file }} config --no-interpolate --no-normalize --no-path-resolution >> ${{ runner.temp }}/docker-compose.yml
    - name: Remove env_file from all services
      shell: bash
      run: |
        wget https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 -O ${{ runner.temp }}/yq &&\
        chmod +x ${{ runner.temp }}/yq
        ${{ runner.temp }}/yq -i 'del(.services.*.env_file)' ${{ runner.temp }}/docker-compose.yml
    - name: Deploy
      shell: bash
      run: |
        DEPLOY_KEY="${{ inputs.server_deploy_key }}"
        PROXY_COMMAND="-o StrictHostKeyChecking=no -J ${{ inputs.server_jumphost }}"
        eval "$(ssh-agent)" && echo "${DEPLOY_KEY}" | base64 -d | ssh-add -
        ssh -o StrictHostKeyChecking=no ${{ inputs.server_jumphost }} "hostname"
        ssh ${PROXY_COMMAND} ${{ inputs.server }} mkdir -p ${{ inputs.server_deploy_dir }}
        scp ${PROXY_COMMAND} {${{ runner.temp }}/docker-compose.yml,${{ github.action_path }}/Makefile,${{ runner.temp}}/.env.deploy} ${{ inputs.server }}:${{ inputs.server_deploy_dir }}
        if [[ -n "${{ inputs.copy_files }}" ]]; then \
          readarray -d " " -t files <<< "${{ inputs.copy_files }}" ; \
          for (( n=0; n < ${#files[*]}; n++)); do \
            readarray -d : -t strarr <<< "${files[n]}" ; \
            scp ${PROXY_COMMAND} ${strarr[0]} ${{ inputs.server }}:${{ inputs.server_deploy_dir }}/${strarr[1]} ; \
          done ; \
        fi
        ssh ${PROXY_COMMAND} ${{ inputs.server }} "cd ${{ inputs.server_deploy_dir }}; make start"
