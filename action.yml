name: "Imatic LXC Deploy"
description: "Deploys a docker compose file to LXC container."
inputs:
  server:
    description: "Hostname of the LXC server."
    required: true
  server_deploy_key:
    description: "Base64 encoded SSH private key to be used for deployment."
    required: true
  server_jumphost:
    description: "Hostname of the jumphost."
    required: true
    default: "imaticit-jumphost-prod@prod.imaticit-jumphost.dev.imatic.cz"
  server_deploy_dir:
    description: "Directory on the server where the project will be deployed."
    required: true
  project_domain_name:
    description: "Domain name of the project."
    required: true
  docker_compose_file:
    description: "The path to docker-compose file."
    required: true
    default: "./docker-compose.yml"
  version:
    description: "Image tag to be deployed."
    required: true
  registry:
    description: "The name of the docker registry to pull from."
    required: true
    default: "ghcr.io"
  external_network:
    description: "Ensures that this docker external network is created for the project when deploying to the server."
    required: false
  copy_files:
    description: |-
      List of files or directories to copy from repository to server. GitHub doesn't support array yet, so it is specified as a string.

      ```yaml
      copy_files: >-
        file-in-repository1:destination-file1
        dir-in-repository:destination-dir
      ```

      When source is a directory, its contents are copied into the destination directory.
    required: false
  service:
    description: "The name of the service to deploy."
    required: false
    default: ""
  down_options:
    description: "Options for `docker compose down` command"
    required: false
    default: ""
  post_deploy_make_target:
    description: "Make target to run on the server after `make start` succeeds."
    required: false
    default: ""
  app_servers:
    description: |-
      Space-separated list of domain names to generate imatic.server labels for.
      Labels are injected into the service specified by `labels_target`.

      ```yaml
      app_servers: >-
        www.example.com
        stage.example.com
      ```
    required: false
    default: ""
  labels_target:
    description: "The compose service to inject the generated domain labels into."
    required: false
    default: "app"
  proxy_pass_port:
    description: "The proxy_pass port used in the generated labels."
    required: false
    default: "8080"
  image_keep_n:
    description: "Number of most recent PROJECT_IMAGE versions to keep on the server. Older versions are removed before pulling the new one."
    required: false
    default: "1"
runs:
  using: "composite"
  steps:
    - name: Set project env variables
      shell: bash
      run: |
        echo "# This file is generated by Imatic LXC Deploy action and should not be edited manually." > ${{ runner.temp }}/.env.deploy
        echo "PROJECT_IMAGE=${{ inputs.registry }}/${{ github.repository }}" >> ${{ runner.temp }}/.env.deploy
        PROJECT_VERSION=${{ inputs.version }} echo "PROJECT_VERSION=${PROJECT_VERSION:-$(git rev-parse --short HEAD)}" >> ${{ runner.temp }}/.env.deploy
        echo PROJECT_SERVER_NAME=${{ inputs.project_domain_name }} >> ${{ runner.temp }}/.env.deploy
        if [[ -n "${{ inputs.external_network }}" ]]; then echo PROJECT_EXTERNAL_NETWORK=${{ inputs.external_network }} >> ${{ runner.temp }}/.env.deploy; fi
    - name: Evaluate docker compose file
      shell: bash
      run: |
        docker compose -f ${{ inputs.docker_compose_file }} config --no-interpolate --no-normalize --no-path-resolution >> ${{ runner.temp }}/docker-compose.yml
    - name: Remove env_file from all services
      shell: bash
      run: |
        wget https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 -O ${{ runner.temp }}/yq &&\
        chmod +x ${{ runner.temp }}/yq
        ${{ runner.temp }}/yq -i 'del(.services.*.env_file)' ${{ runner.temp }}/docker-compose.yml
    - name: Generate imatic.server labels
      if: ${{ inputs.app_servers != '' }}
      shell: bash
      env:
        APP_SERVERS: ${{ inputs.app_servers }}
        LABELS_TARGET: ${{ inputs.labels_target }}
        PROXY_PASS_PORT: ${{ inputs.proxy_pass_port }}
        DOCKER_COMPOSE_FILE: ${{ runner.temp }}/docker-compose.yml
        YQ: ${{ runner.temp }}/yq
      run: ${{ github.action_path }}/bin/generate-labels.sh
    - name: Deploy
      shell: bash
      run: |
        DEPLOY_KEY="${{ inputs.server_deploy_key }}"
        PROXY_COMMAND="-o StrictHostKeyChecking=no -J ${{ inputs.server_jumphost }}"
        eval "$(ssh-agent)" && echo "${DEPLOY_KEY}" | base64 -d | ssh-add -
        ssh -o StrictHostKeyChecking=no ${{ inputs.server_jumphost }} "hostname"
        ssh ${PROXY_COMMAND} ${{ inputs.server }} mkdir -p ${{ inputs.server_deploy_dir }}/bin
        scp ${PROXY_COMMAND} {${{ runner.temp }}/docker-compose.yml,${{ github.action_path }}/Makefile,${{ runner.temp}}/.env.deploy} ${{ inputs.server }}:${{ inputs.server_deploy_dir }}
        scp ${PROXY_COMMAND} ${{ github.action_path }}/bin/docker-cleanup.sh ${{ inputs.server }}:${{ inputs.server_deploy_dir }}/bin/docker-cleanup.sh
        if [[ -n "${{ inputs.copy_files }}" ]]; then \
          readarray -d " " -t files <<< "${{ inputs.copy_files }}" ; \
          for (( n=0; n < ${#files[*]}; n++)); do \
            readarray -d : -t strarr <<< "${files[n]}" ; \
            src="${strarr[0]//[$'\t\r\n ']/}" ; \
            dest="${strarr[1]//[$'\t\r\n ']/}" ; \
            if [[ -d "${src}" ]]; then \
              ssh ${PROXY_COMMAND} ${{ inputs.server }} "mkdir -p ${{ inputs.server_deploy_dir }}/${dest}" ; \
              rsync -az -e "ssh -o StrictHostKeyChecking=no -J ${{ inputs.server_jumphost }}" "${src}/" ${{ inputs.server }}:${{ inputs.server_deploy_dir }}/${dest}/ ; \
            else \
              ssh ${PROXY_COMMAND} ${{ inputs.server }} "mkdir -p $(dirname ${{ inputs.server_deploy_dir }}/${dest})" ; \
              scp ${PROXY_COMMAND} "${src}" ${{ inputs.server }}:${{ inputs.server_deploy_dir }}/${dest} ; \
            fi ; \
          done ; \
        fi
        SSH_CMD="which make 2>/dev/null || apt-get install make; cd ${{ inputs.server_deploy_dir }}; make cleanup IMAGE_KEEP_N=${{ inputs.image_keep_n }}; make start SERVICE=${{ inputs.service }} DOWN_OPTIONS=${{ inputs.down_options }}"
        if [[ -n "${{ inputs.post_deploy_make_target }}" ]]; then
          SSH_CMD="${SSH_CMD} && make ${{ inputs.post_deploy_make_target }}"
        fi
        ssh ${PROXY_COMMAND} ${{ inputs.server }} "${SSH_CMD}"
